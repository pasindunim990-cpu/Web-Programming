<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bill Splitter</title><link rel="stylesheet" href="style.css"><script src="bill.js" defer></script></head>
<body><main class="container"><h1>Restaurant Bill Splitter</h1><p>Enter the food items, choose a tip and split the bill between your group.</p>
<section class="panel"><h2>Menu items</h2><div class="item-entry"><label for="itemName">Item name</label><input id="itemName" type="text" placeholder="e.g. Rice and curry"><label for="itemPrice">Price (LKR)</label><input id="itemPrice" type="number" min="0.01" step="0.01" placeholder="1200"><button id="addItem" type="button">Add item</button></div><ul id="itemList" aria-live="polite"></ul><p class="total">Items total: LKR <span id="subtotal">0.00</span></p></section>
<section class="panel"><h2>Split the bill</h2><label for="tipRate">Tip rate</label><select id="tipRate"><option value="0">0%</option><option value="5">5%</option><option value="10" selected>10%</option><option value="15">15%</option><option value="20">20%</option></select><label for="people">Number of people</label><input id="people" type="number" min="1" step="1" value="2"><button id="calculate" type="button">Calculate bill</button><div id="errors" class="errors" role="alert"></div><div id="result" class="result" aria-live="polite"></div></section>
<p class="small">Prices are example values. This page uses JavaScript only for the calculations and item list.</p></main></body></html>
