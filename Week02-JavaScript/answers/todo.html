<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Simple ToDo List</title><link rel="stylesheet" href="style.css"><script src="todo.js" defer></script></head><body><main class="container"><h1>My ToDo List</h1><p>Add tasks and tick them when completed. The list is not saved after refreshing.</p><div class="panel"><label for="taskInput">New task</label><input id="taskInput" type="text" placeholder="Enter a task"><button id="addTask" type="button">Add task</button><p id="todoError" class="errors" role="alert"></p><ul id="tasks"></ul></div><p><a href="index.html">Back to bill splitter</a></p></main></body></html>
